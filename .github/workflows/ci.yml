name: CI

# The gate before the merge. CD already exists (Vercel builds on main);
# this job is what makes a merge to main checked instead of hoped for.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # A disposable Postgres. The integration canary writes and deletes rows,
    # so it gets its own database instead of the shared development branch.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gitdone_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Shell env wins over tests/setup.ts's dotenv, so the test uses this
      # database, not a .env file. DIRECT_URL is deliberately unset:
      # prisma7.config.ts falls through to DATABASE_URL.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gitdone_test
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # src/lib/prisma.ts imports the generated client, which lives in
      # src/app/generated/prisma. Regenerate so CI cannot pass on a stale client.
      - name: Generate Prisma client
        run: npx prisma generate --config prisma7.config.ts

      - name: Apply migrations
        run: npx prisma migrate deploy --config prisma7.config.ts

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
